<VirtualHost *:443>
    ServerName boilerplate.xikun.de

    Header always set Strict-Transport-Security "max-age=63072000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    DocumentRoot /var/www/boilerplate/html
    RedirectMatch 308 ^/api$ /api/
    ProxyPreserveHost On

    ProxyPass /api/ http://127.0.0.1:3001/
    ProxyPassReverse /api/ http://127.0.0.1:3001/

    <Directory /var/www/boilerplate/html>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/boilerplate-error.log
    CustomLog ${APACHE_LOG_DIR}/boilerplate-access.log combined

    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/letsencrypt/live/xikun.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/xikun.de/privkey.pem
</VirtualHost>
